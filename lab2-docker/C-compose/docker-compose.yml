name: having-fun

services:
  db:
    image: postgres:16-alpine
    container_name: lab2-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mood_password}
      POSTGRES_DB: ${POSTGRES_DB:-mood_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../..
      dockerfile: lab2-docker/B-good/Dockerfile
    image: having-fun-backend:good
    container_name: lab2-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      BACKEND_ID: compose
      POSTGRES_USER: ${POSTGRES_USER:-mood}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mood_password}
      POSTGRES_DB: ${POSTGRES_DB:-mood_db}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    image: nginx:1.27-alpine
    container_name: lab2-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-net

volumes:
  db_data:

networks:
  backend-net:
  frontend-net:
