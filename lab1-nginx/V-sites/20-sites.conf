# 20-sites.conf — часть В: виртуальные хосты, статика, /docs через alias.
# Подключается из nginx.conf внутри http { include /etc/nginx/conf.d/*.conf; }
# Требует upstream "backend" из 00-upstream.conf (часть Б).

# --- Хост по умолчанию: ловит чужие/неизвестные Host и ничего не отдаёт ---
server {
    listen 80 default_server;
    server_name _;

    location /errors/ {
        internal;
        alias /var/www/lab1/errors/;
    }

    location / {
        return 404;          # покажется страница из 30-errors.conf
    }
}

# --- Проект 1: site1.local — фронт + /docs + /api ---
server {
    listen 80;
    server_name site1.local;

    root /var/www/lab1/static;
    index index.html;

    location /errors/ {
        internal;
        alias /var/www/lab1/errors/;
    }

    # статику фронта отдаёт сам nginx
    location / {
        try_files $uri $uri/ =404;
    }

    # alias: URL /docs/... -> каталог /var/www/lab1/docs/...
    location /docs/ {
        alias /var/www/lab1/docs/;
        index index.html;
    }

    # API -> upstream из части Б (limit_req добавляет часть А)
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Проект 2: site2.local — отдельная статика, без /docs и /api ---
server {
    listen 80;
    server_name site2.local;

    root /var/www/lab1/site2;
    index index.html;

    location /errors/ {
        internal;
        alias /var/www/lab1/errors/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
