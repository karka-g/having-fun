# Виртуальные хосты site1.local и site2.local. Всё за HTTPS (443).

# --- 443 default server: ловит чужие/неизвестные Host, отдаёт 404 ---
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location /errors/ {
        internal;
        alias /var/www/lab1/errors/;
    }

    location / {
        return 404;
    }
}

# --- Проект 1: site1.local ---
server {
    listen 443 ssl;
    server_name site1.local;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /var/www/lab1/static;
    index index.html;

    location /errors/ {
        internal;
        alias /var/www/lab1/errors/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /docs/ {
        alias /var/www/lab1/docs/;
        index index.html;
    }

    location /api/ {
        limit_req zone=api_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/htpasswd;

        alias /var/www/lab1/admin/;
        index index.html;
    }
}

# --- Проект 2: site2.local ---
server {
    listen 443 ssl;
    server_name site2.local;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    root /var/www/lab1/site2;
    index index.html;

    location /errors/ {
        internal;
        alias /var/www/lab1/errors/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
