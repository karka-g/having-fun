# Ограничение частоты запросов на /api — общее для всего http.
# Объявляется здесь ОДИН раз, больше нигде повторять нельзя.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

# HTTP (порт 80) — только редирект на HTTPS.
server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}
